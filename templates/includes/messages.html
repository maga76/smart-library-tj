{% if messages %}
<div class="messages-container mb-4">
    {% for message in messages %}
    <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show border-0 shadow-sm rounded-4 d-flex align-items-center p-3" role="alert">
        <div class="me-3 fs-4">
            {% if message.tags == 'success' %}
                <i class="bi bi-check-circle-fill text-success"></i>
            {% elif message.tags == 'warning' %}
                <i class="bi bi-exclamation-triangle-fill text-warning"></i>
            {% elif message.tags == 'danger' or message.tags == 'error' %}
                <i class="bi bi-x-circle-fill text-danger"></i>
            {% else %}
                <i class="bi bi-info-circle-fill text-primary"></i>
            {% endif %}
        </div>
        <div class="flex-grow-1 font-weight-medium">
            {{ message }}
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    {% endfor %}
</div>
{% endif %}
